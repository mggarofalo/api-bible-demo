name: Tests

# Runs the unit tests on every push and pull request. Needs no secrets and no network
# access to the API. Fails when a test fails, or when the coverage is less than the
# thresholds in vitest.config.mts.

on:
  push:
  pull_request:
  workflow_dispatch:

# A push to a branch with an open pull request starts two runs. Keep only the newest
# run of each branch.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Add the coverage table to the run summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const { total } = require("./coverage/coverage-summary.json");
              console.log("### Unit test coverage\n\n| Measure | Covered |\n| --- | --- |");
              for (const key of ["lines", "branches", "functions", "statements"]) {
                console.log(`| ${key} | ${total[key].pct}% (${total[key].covered} of ${total[key].total}) |`);
              }
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
