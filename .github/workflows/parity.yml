name: Parity

# Keeps the demo in sync with the API reference that API.Bible publishes.
#
#   static  Runs on every push and pull request. Needs no secrets and no network access
#           to the API. Fails when the demo does not account for an endpoint or a query
#           parameter of the reference snapshot (see parity/coverage.mjs).
#   live    Runs each night, and on request. Fails when the published reference is
#           different from the snapshot (the API changed), or when a page of the built
#           demo does not send the API request that its controls describe. Needs the
#           repository secret API_BIBLE_API_KEY.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run parity

  live:
    # Pull requests from forks cannot read secrets, so the live check does not run for them
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      API_BIBLE_API_KEY: ${{ secrets.API_BIBLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the demo
        run: npm run start &
      - name: Check each page against the live API
        run: npm run parity:live -- --wait=60
